spring.application.name=sophia

# ===================== IA local (Ollama) =====================
# Padrao: localhost (rodar a aplicacao direto no seu PC / pela IDE).
# No docker compose, a variavel de ambiente SPRING_AI_OLLAMA_BASE_URL
# sobrescreve isto para http://ollama:11434 (nome do servico na rede do compose).
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.init.pull-model-strategy=when_missing
spring.ai.ollama.chat.options.model=gemma4:e4b
spring.ai.ollama.embedding.options.model=nomic-embed-text

# ===================== Banco (PostgreSQL + pgvector) =====================
# Padrao: localhost. No docker compose, SPRING_DATASOURCE_URL sobrescreve
# para o host 'pgvector'. O schema e criado por init-db/01-init.sql.
spring.datasource.url=jdbc:postgresql://localhost:5432/sophia_db
spring.datasource.username=admin
spring.datasource.password=12345
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ===================== Agente SophIA =====================
# Estrategia (planner) padrao: react | plan-then-execute | human-in-the-loop
sophia.planner=plan-then-execute
# Trava anti-loop: maximo de ciclos de planejamento por requisicao.
sophia.max-iterations=12
# Quantidade maxima de livros retornados por busca.
sophia.search-limit=5
# Limite de linhas importadas do books.csv (-1 = todas).
sophia.import-limit=-1
# Popular o catalogo (importar + indexar) sozinho no primeiro boot, se o banco estiver vazio.
sophia.auto-seed=true
